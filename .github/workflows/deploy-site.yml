name: Deploy Website (Mittwald)

# main = live. Baut die Website und lädt sie per SFTP in den Ordner der mStudio-App
# (z. B. /html/weihnachtslounge für weihnachtslounge.studio-f.club). Einrichtung: docs/MITTWALD.md.
# Es wird nichts gelöscht; liegt im Zielordner eine andere Website, bricht der Upload ab.
# Solange der SFTP-Zugang nicht hinterlegt ist, wird der Upload übersprungen (kein Fehler).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Öffentliche Werte als Variables oder Secrets (Settings → Secrets and variables → Actions)
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || secrets.VITE_PUBLIC_SITE_URL }}
      VITE_NOINDEX: ${{ vars.VITE_NOINDEX || secrets.VITE_NOINDEX }}
      # SFTP-Zugang zur mStudio-App als Secrets (alte STRATO_*-Namen werden auch gelesen)
      DEPLOY_SFTP_HOST: ${{ secrets.DEPLOY_SFTP_HOST || secrets.STRATO_SFTP_HOST }}
      DEPLOY_SFTP_PORT: ${{ secrets.DEPLOY_SFTP_PORT }}
      DEPLOY_SFTP_USER: ${{ secrets.DEPLOY_SFTP_USER || secrets.STRATO_SFTP_USER }}
      DEPLOY_SFTP_PASSWORD: ${{ secrets.DEPLOY_SFTP_PASSWORD || secrets.STRATO_SFTP_PASSWORD }}
      DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR || secrets.STRATO_TARGET_DIR }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || secrets.STRATO_SSH_KNOWN_HOSTS }}
    steps:
      - name: Zugang hinterlegt?
        id: check
        run: |
          missing=""
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_PUBLIC_SITE_URL DEPLOY_SFTP_HOST DEPLOY_SFTP_USER DEPLOY_SFTP_PASSWORD DEPLOY_TARGET_DIR; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Upload übersprungen – es fehlt:$missing (siehe docs/MITTWALD.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Prüfen und bauen
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: lftp installieren
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Klare Fehlermeldung, falls der SFTP-Server nicht erreichbar ist (statt nur „max-retries“)
      - name: SFTP-Server erreichbar?
        if: steps.check.outputs.ready == 'true'
        run: |
          port="${DEPLOY_SFTP_PORT:-22}"
          echo "Runner-IP: $(curl -fsS https://api.ipify.org || echo unbekannt)"
          getent ahosts "$DEPLOY_SFTP_HOST" | head -1 || echo "::warning::DNS-Auflösung fehlgeschlagen"
          if timeout 15 bash -c "</dev/tcp/$DEPLOY_SFTP_HOST/$port"; then
            echo "TCP-Port $port erreichbar"
            timeout 15 ssh-keyscan -p "$port" "$DEPLOY_SFTP_HOST" 2>/dev/null | head -1 | cut -c1-60 || true
          else
            echo "::error::SFTP-Server $port nicht erreichbar (Zeitüberschreitung) – Mittwald blockiert die Verbindung oder der Server ist gestört"
            exit 1
          fi

      # Prüft Zielordner und Build, lädt dann hoch (zuletzt .htaccess und index.html)
      - name: Hochladen
        if: steps.check.outputs.ready == 'true'
        run: bash scripts/deploy-sftp.sh

      - name: Live-Seite erreichbar?
        if: steps.check.outputs.ready == 'true'
        run: |
          url="${VITE_PUBLIC_SITE_URL%/}/"
          for i in 1 2 3; do
            if curl -fsS "$url" | grep -q '<div id="root">'; then echo "ok: $url"; exit 0; fi
            sleep 5
          done
          echo "::error::$url liefert nicht die Lounge-Seite"; exit 1
