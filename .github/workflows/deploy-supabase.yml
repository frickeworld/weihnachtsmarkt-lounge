name: Deploy Supabase

# main = live. Jeder Push auf main spielt Migrations und Edge Functions ins Supabase-Projekt ein.
# Migrations sind nur additiv (siehe CLAUDE.md).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets vorhanden?
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::GitHub-Secret $v fehlt (siehe docs/SETUP.md)"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Projekt verknüpfen
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations einspielen
        run: |
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          else
            echo "Noch keine Migrations."
          fi

      - name: Edge Functions deployen
        run: |
          if ls -d supabase/functions/*/ 2>/dev/null | grep -v '/_' >/dev/null; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Noch keine Edge Functions."
          fi
